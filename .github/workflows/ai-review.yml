name: Instructor AI coaching
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number reviewed for privacy and publication permission
        required: true
        type: string
      approved_sha:
        description: Full 40-character PR head SHA approved for provider processing
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ai-review-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  coach:
    if: github.ref == 'refs/heads/main'
    environment: ai-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ai-review.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
